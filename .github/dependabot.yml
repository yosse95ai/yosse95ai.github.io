# Dependabot による依存関係の自動更新
# Bun は テキスト形式の bun.lock をサポート（bun >= 1.1.39）
# https://docs.github.com/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # TypeScript 7 系（ネイティブコンパイラ）は astro check が依存する
      # programmatic API を提供していないため型チェックが動作しない。
      # Astro 側が対応したらこの ignore を削除する
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    # 関連パッケージはまとめて 1 PR にしてレビュー回数を減らす
    groups:
      astro:
        patterns:
          - "astro"
          - "astro-icon"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
      iconify:
        patterns:
          - "@iconify-json/*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"
